name: Build DoxaGuard APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable

      - name: Install Flet
        run: pip install flet==0.25.2

      - name: Build APK
        run: flet build apk --project "DoxaGuard" --org com.doxaguard

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DoxaGuard_APK
          path: build/apk/app-release.apk
