name: Build Doxachkaa APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flet and build APK
        run: |
          pip install flet==0.25.2
          flet build apk --project "Doxachkaa Master Utilities"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Doxachkaa_Master_Utilities_APK
          path: build/apk/app-release.apk
